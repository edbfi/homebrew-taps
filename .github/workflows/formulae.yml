name: Linux formulae

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: formulae-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.sources.outputs.build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate formula inventory
        id: sources
        run: |
          set -euo pipefail
          bash scripts/discover.sh '' formula > "$RUNNER_TEMP/formula-matrix.json"
          jq -e '.formula | sort == ["fcast-sender", "fredtv", "pipewire-gstreamer", "qview"]' "$RUNNER_TEMP/formula-matrix.json"
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-formulae
          path: Formula/*.rb

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64_linux
          - runner: ubuntu-24.04-arm
            arch: arm64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_DEVELOPER: "1" # Homebrew requires this for local bottle installation tests.
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_MAKE_JOBS: "2"
      BOTTLE_ROOT: https://github.com/${{ github.repository }}/releases/download/formulae-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          stable: "true"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: candidate-formulae
          path: Formula
      - name: Register checkout and virtual displays
        run: |
          set -euo pipefail
          [[ "$(cd "$(brew --repository edbfi/taps)" && pwd -P)" == "$(cd "$GITHUB_WORKSPACE" && pwd -P)" ]]
          brew trust edbfi/taps
          sudo apt-get update
          sudo apt-get install -y xvfb xauth weston dbus-x11
      - name: Build, test, and bottle each package in order
        run: |
          set -euo pipefail
          mkdir -p bottles
          # Bottle immediately: Homebrew records prefix changes during each build.
          for token in pipewire-gstreamer qview fredtv fcast-sender; do
            if jq -e --arg token "$token" 'index($token) != null' pipelines/bottles.json > /dev/null; then
              brew install --formula --build-bottle "edbfi/taps/$token"
            else
              brew install --formula --build-from-source "edbfi/taps/$token"
            fi
            brew test "edbfi/taps/$token"
            brew linkage --test "edbfi/taps/$token"
            brew audit --strict --formula "edbfi/taps/$token"
            if jq -e --arg token "$token" 'index($token) != null' pipelines/bottles.json > /dev/null; then
              (cd bottles && brew bottle --json --no-rebuild --root-url="$BOTTLE_ROOT" "edbfi/taps/$token")
            fi
          done
      - name: X11 and Wayland app checks
        env:
          GUI_TEST_ARTIFACTS: /tmp/tap-gui-results/source
        run: bash scripts/test-linux-gui.sh
      - name: Reinstall from local bottles and retest
        env:
          GUI_TEST_ARTIFACTS: /tmp/tap-gui-results/reinstalled
        run: |
          set -euo pipefail
          mapfile -t bottle_tokens < <(jq -r '.[]' pipelines/bottles.json)
          brew uninstall --formula "${bottle_tokens[@]}"
          for artifact in bin/fcast-sender bin/qview \
            share/applications/org.fcast.Sender.desktop \
            share/applications/com.interversehq.qView.desktop; do
            installed_path="$(brew --prefix)/$artifact"
            [[ ! -e "$installed_path" && ! -L "$installed_path" ]]
          done
          for token in "${bottle_tokens[@]}"; do
            brew install --formula bottles/"$token"--*.bottle.tar.gz
            brew test "edbfi/taps/$token"
          done
          bash scripts/test-linux-gui.sh
      - name: Archive corresponding sources and dependency licenses
        if: matrix.arch == 'x86_64_linux'
        run: |
          set -euo pipefail
          for token in pipewire-gstreamer qview fredtv fcast-sender; do
            python3 scripts/source-bundle.py "$token" bottles
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bottles-${{ matrix.arch }}
          path: bottles/*
          retention-days: 14
          if-no-files-found: error
      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs-${{ matrix.arch }}
          path: |
            ~/.cache/Homebrew/Logs
            /tmp/tap-gui-results
      - name: Retain GUI evidence
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.arch }}
          if-no-files-found: error
          path: /tmp/tap-gui-results

  verify:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BOTTLE_ROOT: https://github.com/${{ github.repository }}/releases/download/formulae-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          stable: "true"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: bottles-*
          merge-multiple: true
          path: bottles
      - name: Verify complete architecture and source set
        run: |
          set -euo pipefail
          python3 scripts/verify-bottles.py bottles "$BOTTLE_ROOT"
          [[ "$(cd "$(brew --repository edbfi/taps)" && pwd -P)" == "$(cd "$GITHUB_WORKSPACE" && pwd -P)" ]]
          brew trust edbfi/taps
          brew bottle --merge --write --no-commit bottles/*.bottle.json
          brew style edbfi/taps
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-linux-packages
          path: |
            bottles/
            Formula/
          if-no-files-found: error
          retention-days: 14
