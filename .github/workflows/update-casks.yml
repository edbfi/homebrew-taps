name: Update casks
'on':
  schedule:
  - cron: 0 */6 * * *
  workflow_dispatch:
    inputs:
      cask:
        description: Only update this cask token (leave blank for all)
        required: false
        default: ''
        type: string
concurrency:
  group: update-casks
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Require successful CI for this revision
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        gh run list --workflow ci.yml --branch main --commit "$EXPECTED_SHA" \
          --json conclusion,event,status --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | first | .status == "completed" and .conclusion == "success"' | grep -qx true
    - name: Build matrix from pipelines/
      id: discover
      env:
        CASK_FILTER: ${{ inputs.cask }}
      run: |
        matrix="$(bash scripts/discover.sh "$CASK_FILTER")"
        echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
        echo "Matrix: ${matrix}"
    if: github.repository == 'edbfi/homebrew-taps' && github.ref_name == github.event.repository.default_branch
    timeout-minutes: 5
  update:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_update-cask.yml
    with:
      cask: ${{ matrix.cask }}
    secrets: inherit
