# SPDX-License-Identifier: AGPL-3.0-only
# The cask updater. Every six hours each cask is
# checked; an update is published to its rolling release, fetched back through the
# rewritten cask, then pushed straight to main with the deploy key. Stages live in
# scripts/update.sh. Every stage runs one job per cask, with the cask's own timeout
# (UPDATE_MINUTES in its config.env), so a failing cask turns the run red without
# stopping the others; retry with a new run, never a re-run.
name: Update casks
on:
  schedule: [{ cron: "37 */6 * * *" }]
  workflow_dispatch:
    inputs:
      cask:
        description: Only this cask token (blank for all)
        type: string
        default: ""
permissions: {}
concurrency:
  group: update-casks
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      casks: ${{ steps.discover.outputs.casks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: discover
        env:
          CASK_FILTER: ${{ inputs.cask }}
        run: |
          set -euo pipefail
          found="$(bash scripts/discover.sh "$CASK_FILTER")"
          echo "casks=$(jq -ce '.cask | select(length > 0)' <<<"$found")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -ce '.matrix | select(length > 0)' <<<"$found")" >> "$GITHUB_OUTPUT"

  # Job 1: unprivileged. Its claim (version and sha256) is only a claim.
  check:
    name: check (${{ matrix.cask }})
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: macos-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: check
        env:
          CASK: ${{ matrix.cask }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/update.sh check "$CASK" "$RUNNER_TEMP/claim" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.claim == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claim-${{ matrix.cask }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claim/claim.env
          retention-days: 1
          if-no-files-found: error

  # Lists the claims; with none, the jobs below are skipped.
  plan:
    needs: [discover, check]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      casks: ${{ steps.plan.outputs.casks }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: plan
        env:
          CASKS: ${{ needs.discover.outputs.casks }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/update.sh plan "$CASKS" >> "$GITHUB_OUTPUT"

  # Job 2: privileged (shell only). Re-derives the claim from main's own scripts.
  # `published` finds these jobs by name: keep it "publish (TOKEN)".
  publish:
    name: publish (${{ matrix.cask }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.casks != '[]' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions: { contents: write, actions: read }
    steps:
      - name: Fetch main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$RUNNER_TEMP/src"
          git -C "$RUNNER_TEMP/src" -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch -q --depth 1 "https://github.com/$REPO.git" refs/heads/main
          git -C "$RUNNER_TEMP/src" -c core.hooksPath=/dev/null checkout -q FETCH_HEAD
      - env:
          CASK: ${{ matrix.cask }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash "$RUNNER_TEMP/src/scripts/update.sh" publish "$CASK"

  # Lists the casks whose publish job succeeded.
  published:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.casks != '[]' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      casks: ${{ steps.published.outputs.casks }}
      matrix: ${{ steps.published.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: published
        env:
          CASKS: ${{ needs.plan.outputs.casks }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/update.sh published "$CASKS" >> "$GITHUB_OUTPUT"

  # Job 3: unprivileged. Fetches the published download through the rewritten cask.
  verify:
    name: verify (${{ matrix.cask }})
    needs: published
    if: ${{ !cancelled() && needs.published.result == 'success' && needs.published.outputs.casks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.published.outputs.matrix) }}
    runs-on: macos-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - env:
          CASK: ${{ matrix.cask }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/update.sh verify "$CASK" "$RUNNER_TEMP/checked"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-${{ matrix.cask }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked/claim.env
          retention-days: 1
          if-no-files-found: error

  # Lists the verified casks.
  verified:
    needs: [published, verify]
    if: ${{ !cancelled() && needs.published.result == 'success' && needs.published.outputs.casks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      casks: ${{ steps.verified.outputs.casks }}
      matrix: ${{ steps.verified.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: verified
        env:
          CASKS: ${{ needs.published.outputs.casks }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/update.sh verified "$CASKS" >> "$GITHUB_OUTPUT"

  # Job 4: privileged (shell only). Pushes each verified cask as a plain fast-forward,
  # one at a time, so each starts from a main that holds the previous one's push.
  push:
    name: push (${{ matrix.cask }})
    needs: verified
    if: ${{ !cancelled() && needs.verified.result == 'success' && needs.verified.outputs.casks != '[]' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.verified.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions: { contents: read, actions: read }
    steps:
      - name: Push with the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.UPDATER_DEPLOY_KEY }}
          CASK: ${{ matrix.cask }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATER_REMOTE: git@github.com:${{ github.repository }}.git
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          unset DEPLOY_KEY
          # known_hosts from GitHub's published host keys; never trust on first use.
          curl -fsS --proto '=https' https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          if [[ ! -s "$ssh_dir/known_hosts" ]] ||
            grep -Ev '^github\.com (ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) [A-Za-z0-9+/=]+$' "$ssh_dir/known_hosts"
          then
            echo "::error::Unexpected GitHub SSH host keys"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $ssh_dir/key -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes"
          git -c core.hooksPath=/dev/null clone -q --depth 1 --branch main "$UPDATER_REMOTE" "$RUNNER_TEMP/src"
          bash "$RUNNER_TEMP/src/scripts/update.sh" push "$CASK"
