name: ci
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/lint.yml
  linux:
    uses: ./.github/workflows/formulae.yml
  required:
    name: ci / required
    if: always()
    needs:
    - quality
    - linux
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
    - uses: edbfi/automation/actions/gate@v4.1.0
      with:
        needs: ${{ toJSON(needs) }}
        required: quality linux
