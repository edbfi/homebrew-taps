# SPDX-License-Identifier: AGPL-3.0-only
# Copy as .github/workflows/ci.yml; adapt commands, directories and runners to design/repos.md.
# Allocate a distinct weekly minute during rollout. Every added PR job belongs in ci-ok.
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "50 4 * * 0" }]   # weekly main revalidation; minute unique per repo
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with: { extra-args: "--all-files --hook-stage manual" }
  casks:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bash scripts/check-casks.sh
  formulae:
    # Linux ARM64 has no -latest label: use ubuntu-latest's generation (ci.md rule 10).
    strategy: { fail-fast: false, matrix: { runner: [ubuntu-latest, ubuntu-24.04-arm] } }
    runs-on: ${{ matrix.runner }}
    # PRs build changed formulae only; the weekly run builds all four (35-40 min on x86_64 in the retired CI).
    timeout-minutes: 90
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # Virtual displays for the GUI apps' X11 and Wayland checks.
      # The runner's unrelated Google Chrome apt source can fail checksum validation during apt update.
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth weston dbus-x11
      - run: bash scripts/check-formulae.sh
  ci-ok:
    if: always()
    needs: [checks, casks, formulae]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
