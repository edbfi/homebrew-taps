name: Update one cask
'on':
  workflow_call:
    inputs:
      cask:
        description: Cask token (directory name under pipelines/)
        required: true
        type: string
jobs:
  update:
    name: update ${{ inputs.cask }}
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      updated: ${{ steps.check.outputs.needed }}
      new_version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    env:
      CASK: ${{ inputs.cask }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Resolve upstream
      id: resolve
      run: bash scripts/resolve.sh "$CASK" | tee -a "$GITHUB_OUTPUT"
    - name: Check if update is needed
      id: check
      if: steps.resolve.outputs.skip != 'true'
      env:
        NEW_VERSION: ${{ steps.resolve.outputs.version }}
        ASSET: ${{ steps.resolve.outputs.asset }}
      run: bash scripts/check-update.sh "$CASK" "$NEW_VERSION" "$ASSET" | tee -a "$GITHUB_OUTPUT"
    - name: Download upstream build and compute SHA256
      id: fetch
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      env:
        DOWNLOAD_URL: ${{ steps.resolve.outputs.download_url }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        ARCHIVE_MEMBER: ${{ steps.resolve.outputs.archive_member }}
      run: |
        mkdir -p "${RUNNER_TEMP}/work" && cd "${RUNNER_TEMP}/work"
        bash "${GITHUB_WORKSPACE}/scripts/fetch-asset.sh" "$DOWNLOAD_URL" "$ASSET" "$ARCHIVE_MEMBER" | tee -a "$GITHUB_OUTPUT"
    - name: Upload DMG artifact for scanning
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.cask }}-dmg
        path: ${{ runner.temp }}/work/${{ steps.resolve.outputs.asset }}
        retention-days: 1
    - name: Verify app identity and architecture before publishing
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
      run: python3 scripts/inspect-macos.py "$CASK" "${RUNNER_TEMP}/work/${ASSET}"
    - name: Prepare rolling release notes
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        PREV_VERSION: ${{ steps.check.outputs.previous_version }}
        REF: ${{ steps.resolve.outputs.ref }}
        CHANGES_URL: ${{ steps.resolve.outputs.changes_url }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        DOWNLOAD_URL: ${{ steps.resolve.outputs.download_url }}
      run: bash scripts/release-notes.sh "$CASK" > "${RUNNER_TEMP}/release-notes.md"
    - name: Publish to rolling release
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      uses: nick-fields/retry@v4.0.0
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
      with:
        timeout_minutes: 10
        max_attempts: 4
        retry_wait_seconds: 20
        command: bash scripts/publish-release.sh "$CASK" "${RUNNER_TEMP}/work/${ASSET}" "${RUNNER_TEMP}/release-notes.md"
    - name: Rewrite cask
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      env:
        CASK_FILE: ${{ steps.resolve.outputs.cask_file }}
        VERSION: ${{ steps.resolve.outputs.version }}
        SHA256: ${{ steps.fetch.outputs.sha256 }}
      run: bash scripts/write-cask.sh "$CASK_FILE" "$VERSION" "$SHA256"
    - name: Propose the generated cask update
      id: cask-pr
      if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.needed == 'true'
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        token: ${{ github.token }}
        base: ${{ github.event.repository.default_branch }}
        branch: fix/update-cask-${{ inputs.cask }}
        add-paths: ${{ steps.resolve.outputs.cask_file }}
        commit-message: 'chore(${{ inputs.cask }}): update to ${{ steps.resolve.outputs.version }}'
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        signoff: true
        title: 'chore(${{ inputs.cask }}): update to ${{ steps.resolve.outputs.version }}'
        body: Update the machine-owned version and checksum after resolving the upstream release, downloading
          and hashing the asset, and publishing the rolling release. Full CI is dispatched for this exact
          PR commit, including native Homebrew style/audit and offline updater fixtures. VirusTotal reporting
          keeps its existing optional behavior.
    - name: Validate the exact cask-pr PR commit
      if: steps.cask-pr.outputs.pull-request-number != ''
      env:
        GH_TOKEN: ${{ github.token }}
        CASK_PR: ${{ steps.cask-pr.outputs.pull-request-number }}
        CASK_SHA: ${{ steps.cask-pr.outputs.pull-request-head-sha }}
        CASK_BRANCH: fix/update-cask-${{ inputs.cask }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if gh workflow run ci.yml --ref "$CASK_BRANCH" \
            -f pr-number="$CASK_PR" -f expected-head-sha="$CASK_SHA"; then
            exit 0
          fi
          sleep "$((attempt * 2))"
        done
        echo "::error::CI dispatch failed. Run ci.yml on $CASK_BRANCH with pr-number=$CASK_PR and expected-head-sha=$CASK_SHA."
        exit 1
    if: github.repository == 'edbfi/homebrew-taps' && github.ref_name == github.event.repository.default_branch
    timeout-minutes: 40
  virustotal-scan:
    name: virustotal ${{ inputs.cask }}
    needs: update
    if: needs.update.outputs.updated == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.update.outputs.release_tag }}
    steps:
    - name: Check VirusTotal configuration
      id: vt_config
      env:
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
      run: |
        if [ -z "${VT_API_KEY:-}" ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "VT_API_KEY is not configured; skipping VirusTotal scan."
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Download DMG artifact
      if: steps.vt_config.outputs.enabled == 'true'
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.cask }}-dmg
    - name: Scan with VirusTotal
      if: steps.vt_config.outputs.enabled == 'true'
      id: virustotal
      uses: crazy-max/ghaction-virustotal@v5.0.0
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        request_rate: 4
        files: |
          *.dmg
    - name: Create scan results summary
      if: steps.vt_config.outputs.enabled == 'true'
      env:
        VIRUSTOTAL_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-casks.yml
      run: |
        {
          echo "### VirusTotal Scan Results"
          echo ""
          echo "**Scan completed:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "| File | Report |"
          echo "|------|--------|"
          IFS=',' read -ra PAIRS <<< "${VIRUSTOTAL_ANALYSIS}"
          for pair in "${PAIRS[@]}"; do
            filename="${pair%%=*}"
            url="${pair#*=}"
            echo "| \`${filename}\` | [View VirusTotal Report](${url}) |"
          done
          echo ""
          echo "---"
          echo ""
          echo "_Scanned and released automatically by the [update-casks workflow](${WORKFLOW_URL})._"
        } | tee virustotal-results.md >> "$GITHUB_STEP_SUMMARY"
    - name: Append VirusTotal results to release notes
      if: steps.vt_config.outputs.enabled == 'true'
      uses: nick-fields/retry@v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 4
        retry_wait_seconds: 20
        command: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body --jq '.body' > current-body.md
          {
            cat current-body.md
            echo ""
            echo "---"
            echo ""
            cat virustotal-results.md
          } > updated-body.md
          gh release edit "$RELEASE_TAG" --notes-file updated-body.md
          echo "VirusTotal results appended to ${RELEASE_TAG} release notes"
    timeout-minutes: 30
permissions:
  contents: read
