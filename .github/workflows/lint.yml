name: Lint
permissions:
  contents: read
jobs:
  casks:
    name: brew style + audit
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Tap this checkout
      run: |
        set -euo pipefail
        tap_parent="$(brew --repository)/Library/Taps/edbfi"
        mkdir -p "$tap_parent"
        ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-taps"
        brew trust edbfi/taps
    - name: Read all casks
      run: |
        set -euo pipefail
        brew readall --no-simulate edbfi/taps
        brew info --json=v2 --cask edbfi/taps/fcast-sender edbfi/taps/flixor \
          edbfi/taps/fredtv edbfi/taps/paicord edbfi/taps/qview > casks-check.json
        jq -e '[.casks[].token] | sort == ["fcast-sender", "flixor", "fredtv", "paicord", "qview"]' casks-check.json
        rm casks-check.json
    - name: brew style
      run: brew style edbfi/taps
    - name: brew audit
      run: brew audit --cask --tap edbfi/taps
    - name: Reject tracked-file changes
      run: git diff --exit-code HEAD
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
  scripts:
    name: shell checks and offline updater fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
    - run: bash .github/scripts/check.sh
    - run: python3 -m unittest discover -s scripts/tests -v
    - run: git diff --exit-code HEAD
'on':
  workflow_call: null
  workflow_dispatch: null
